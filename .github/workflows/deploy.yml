name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:rules
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: Check the service account secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e '
            const fail = (m) => { console.log("::error::FIREBASE_SERVICE_ACCOUNT " + m); process.exit(1) };
            const raw = process.env.FIREBASE_SERVICE_ACCOUNT || "";
            if (!raw.trim()) fail("is empty or missing.");
            let sa;
            try { sa = JSON.parse(raw) } catch { fail("is not valid JSON (" + raw.length + " characters). Paste the whole downloaded key file, from the first { to the last }.") }
            if (sa.type !== "service_account") fail("is JSON but not a service account key (type is " + JSON.stringify(sa.type) + ").");
            for (const k of ["project_id", "client_email", "private_key"]) if (!sa[k]) fail("is missing the " + k + " field.");
            if (!sa.private_key.includes("BEGIN PRIVATE KEY")) fail("has a damaged private_key field.");
            console.log("Service account: " + sa.client_email + " (project " + sa.project_id + ")");
            if (sa.project_id !== process.env.FIREBASE_PROJECT_ID) fail("belongs to project " + sa.project_id + ", but FIREBASE_PROJECT_ID is a different project.");
          '
      - name: Deploy Firestore rules, indexes and Realtime Database rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase-tools deploy --only firestore:rules,firestore:indexes,database --project "$FIREBASE_PROJECT_ID"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
